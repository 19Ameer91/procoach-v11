<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار Pro Coach</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-4xl font-bold text-blue-600 mb-6">🎉 نظام Pro Coach يعمل!</h1>
        
        <div class="space-y-4">
            <div class="bg-green-100 border border-green-400 rounded-lg p-4">
                <h2 class="text-xl font-bold text-green-800 mb-2">✅ الحالة: نشط</h2>
                <p class="text-green-700">التطبيق يعمل بشكل صحيح والـ APIs جاهزة</p>
            </div>

            <div class="grid md:grid-cols-2 gap-4 mt-6">
                <a href="/static/test-auth" class="block bg-blue-600 text-white text-center py-4 rounded-lg hover:bg-blue-700 transition font-bold">
                    🔐 اختبار نظام المصادقة
                </a>
                <a href="/" class="block bg-purple-600 text-white text-center py-4 rounded-lg hover:bg-purple-700 transition font-bold">
                    ⚽ الصفحة الرئيسية
                </a>
            </div>

            <div class="mt-8">
                <h3 class="text-xl font-bold text-gray-800 mb-4">🧪 اختبار APIs:</h3>
                <div class="space-y-2">
                    <button onclick="testAPI('/api/teams')" class="w-full text-left bg-gray-50 hover:bg-gray-100 p-3 rounded border">
                        <span class="font-mono">/api/teams</span> - قائمة الفرق
                    </button>
                    <button onclick="testAPI('/api/leagues')" class="w-full text-left bg-gray-50 hover:bg-gray-100 p-3 rounded border">
                        <span class="font-mono">/api/leagues</span> - قائمة الدوريات
                    </button>
                    <button onclick="testAPI('/api/leagues/public')" class="w-full text-left bg-gray-50 hover:bg-gray-100 p-3 rounded border">
                        <span class="font-mono">/api/leagues/public</span> - الدوريات العامة
                    </button>
                </div>
                <div id="result" class="mt-4 p-4 bg-gray-50 rounded border hidden">
                    <pre id="resultContent" class="text-sm overflow-auto"></pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function testAPI(endpoint) {
            const resultDiv = document.getElementById('result');
            const resultContent = document.getElementById('resultContent');
            
            resultDiv.classList.remove('hidden');
            resultContent.textContent = 'جاري التحميل...';
            
            try {
                const response = await fetch(endpoint);
                const data = await response.json();
                resultContent.textContent = JSON.stringify(data, null, 2);
                resultDiv.className = 'mt-4 p-4 bg-green-50 rounded border border-green-300';
            } catch (error) {
                resultContent.textContent = 'خطأ: ' + error.message;
                resultDiv.className = 'mt-4 p-4 bg-red-50 rounded border border-red-300';
            }
        }
    </script>
</body>
</html>
