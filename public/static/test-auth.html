<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار نظام المصادقة - Pro Coach</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="bg-white rounded-xl shadow-2xl p-6 mb-8">
            <h1 class="text-3xl font-bold text-indigo-900 mb-2">
                <i class="fas fa-shield-alt"></i>
                نظام المصادقة - Pro Coach v8
            </h1>
            <p class="text-gray-600">اختبار تسجيل الدخول والدوريات العامة/الخاصة</p>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
            <!-- تسجيل حساب جديد -->
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h2 class="text-2xl font-bold text-green-700 mb-4">
                    <i class="fas fa-user-plus"></i>
                    تسجيل حساب جديد
                </h2>
                <form id="registerForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">البريد الإلكتروني</label>
                        <input type="email" id="reg_email" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">كلمة المرور</label>
                        <input type="password" id="reg_password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">الاسم الكامل</label>
                        <input type="text" id="reg_fullname" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">الدور</label>
                        <select id="reg_role" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500">
                            <option value="coach">مدرب</option>
                            <option value="admin">مشرف</option>
                            <option value="referee">حكم</option>
                            <option value="team_manager">مدير فريق</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition">
                        <i class="fas fa-check-circle"></i>
                        تسجيل الحساب
                    </button>
                </form>
                <div id="registerResult" class="mt-4 p-3 rounded-lg hidden"></div>
            </div>

            <!-- تسجيل الدخول -->
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h2 class="text-2xl font-bold text-blue-700 mb-4">
                    <i class="fas fa-sign-in-alt"></i>
                    تسجيل الدخول
                </h2>
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">البريد الإلكتروني</label>
                        <input type="email" id="login_email" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">كلمة المرور</label>
                        <input type="password" id="login_password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition">
                        <i class="fas fa-arrow-right"></i>
                        دخول
                    </button>
                </form>
                <div id="loginResult" class="mt-4 p-3 rounded-lg hidden"></div>
            </div>
        </div>

        <!-- معلومات المستخدم -->
        <div id="userProfile" class="bg-white rounded-xl shadow-lg p-6 mt-6 hidden">
            <h2 class="text-2xl font-bold text-purple-700 mb-4">
                <i class="fas fa-user-circle"></i>
                معلومات المستخدم
            </h2>
            <div id="profileContent" class="space-y-2"></div>
            <button onclick="logout()" class="mt-4 bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700 transition">
                <i class="fas fa-sign-out-alt"></i>
                تسجيل الخروج
            </button>
        </div>

        <!-- الدوريات العامة -->
        <div class="bg-white rounded-xl shadow-lg p-6 mt-6">
            <h2 class="text-2xl font-bold text-indigo-700 mb-4">
                <i class="fas fa-globe"></i>
                الدوريات العامة المتاحة
            </h2>
            <button onclick="loadPublicLeagues()" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition mb-4">
                <i class="fas fa-sync"></i>
                تحديث القائمة
            </button>
            <div id="publicLeagues" class="grid md:grid-cols-2 gap-4"></div>
        </div>
    </div>

    <script>
        let sessionToken = localStorage.getItem('session_token');

        // تسجيل حساب جديد
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('registerResult');
            
            try {
                const response = await axios.post('/api/register', {
                    email: document.getElementById('reg_email').value,
                    password: document.getElementById('reg_password').value,
                    full_name: document.getElementById('reg_fullname').value,
                    role: document.getElementById('reg_role').value
                });
                
                resultDiv.className = 'mt-4 p-3 rounded-lg bg-green-100 text-green-800';
                resultDiv.textContent = '✅ ' + response.data.message;
                resultDiv.classList.remove('hidden');
                
                // تنظيف النموذج
                document.getElementById('registerForm').reset();
            } catch (error) {
                resultDiv.className = 'mt-4 p-3 rounded-lg bg-red-100 text-red-800';
                resultDiv.textContent = '❌ ' + (error.response?.data?.error || 'حدث خطأ');
                resultDiv.classList.remove('hidden');
            }
        });

        // تسجيل الدخول
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('loginResult');
            
            try {
                const response = await axios.post('/api/login', {
                    email: document.getElementById('login_email').value,
                    password: document.getElementById('login_password').value
                });
                
                sessionToken = response.data.session_token;
                localStorage.setItem('session_token', sessionToken);
                
                resultDiv.className = 'mt-4 p-3 rounded-lg bg-green-100 text-green-800';
                resultDiv.textContent = '✅ ' + response.data.message;
                resultDiv.classList.remove('hidden');
                
                // عرض بيانات المستخدم
                await loadProfile();
                
                // تنظيف النموذج
                document.getElementById('loginForm').reset();
            } catch (error) {
                resultDiv.className = 'mt-4 p-3 rounded-lg bg-red-100 text-red-800';
                resultDiv.textContent = '❌ ' + (error.response?.data?.error || 'حدث خطأ');
                resultDiv.classList.remove('hidden');
            }
        });

        // عرض بيانات المستخدم
        async function loadProfile() {
            if (!sessionToken) return;
            
            try {
                const response = await axios.get('/api/profile', {
                    headers: { 'Authorization': 'Bearer ' + sessionToken }
                });
                
                const user = response.data.user;
                const profileDiv = document.getElementById('userProfile');
                const contentDiv = document.getElementById('profileContent');
                
                contentDiv.innerHTML = `
                    <p class="text-lg"><strong>الاسم:</strong> ${user.full_name}</p>
                    <p class="text-lg"><strong>البريد:</strong> ${user.email}</p>
                    <p class="text-lg"><strong>الدور:</strong> ${user.role}</p>
                    <p class="text-sm text-gray-500"><strong>تاريخ التسجيل:</strong> ${user.created_at}</p>
                `;
                
                profileDiv.classList.remove('hidden');
            } catch (error) {
                console.error('خطأ في تحميل البروفايل:', error);
            }
        }

        // تسجيل الخروج
        async function logout() {
            try {
                await axios.post('/api/logout', {
                    session_token: sessionToken
                });
                
                localStorage.removeItem('session_token');
                sessionToken = null;
                
                document.getElementById('userProfile').classList.add('hidden');
                alert('✅ تم تسجيل الخروج بنجاح');
            } catch (error) {
                console.error('خطأ في تسجيل الخروج:', error);
            }
        }

        // تحميل الدوريات العامة
        async function loadPublicLeagues() {
            const div = document.getElementById('publicLeagues');
            div.innerHTML = '<p class="text-gray-500">جاري التحميل...</p>';
            
            try {
                const response = await axios.get('/api/leagues/public');
                const leagues = response.data.data;
                
                if (leagues.length === 0) {
                    div.innerHTML = '<p class="text-gray-500">لا توجد دوريات عامة حالياً</p>';
                    return;
                }
                
                div.innerHTML = leagues.map(league => `
                    <div class="border border-indigo-200 rounded-lg p-4 hover:shadow-lg transition">
                        <h3 class="text-xl font-bold text-indigo-900 mb-2">${league.name}</h3>
                        <p class="text-gray-600 text-sm mb-3">${league.description || ''}</p>
                        <div class="grid grid-cols-2 gap-2 text-sm">
                            <p><strong>النوع:</strong> ${league.league_category}</p>
                            <p><strong>الموسم:</strong> ${league.season}</p>
                            <p><strong>الحد الأقصى:</strong> ${league.max_teams} فريق</p>
                            <p><strong>الفرق المسجلة:</strong> ${league.teams_count}</p>
                            <p><strong>الحالة:</strong> ${league.status}</p>
                            <p><strong>المشرف:</strong> ${league.admin_name}</p>
                        </div>
                        <button onclick="requestJoin(${league.id})" class="mt-3 w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">
                            <i class="fas fa-plus-circle"></i>
                            تقديم طلب انضمام
                        </button>
                    </div>
                `).join('');
            } catch (error) {
                div.innerHTML = '<p class="text-red-500">❌ حدث خطأ في تحميل الدوريات</p>';
            }
        }

        // طلب انضمام (يحتاج فريق)
        function requestJoin(leagueId) {
            alert('⚠️ لتقديم طلب انضمام، يجب أن يكون لديك فريق مسجل أولاً.');
        }

        // تحميل البروفايل عند فتح الصفحة
        if (sessionToken) {
            loadProfile();
        }

        // تحميل الدوريات عند فتح الصفحة
        loadPublicLeagues();
    </script>
</body>
</html>
